server {
    listen 80;
    server_name localhost;

    # Citizen Frontend
    location / {
        root /usr/share/nginx/html/citizen;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Officer Frontend
    location /officer/ {
        alias /usr/share/nginx/html/officer/;
        index officer.html;
        try_files $uri $uri/ /officer/officer.html;
    }

    # Redirect /officer without slash to /officer/
    location = /officer {
        return 301 /officer/;
    }

    # Redirect /officer.html to /officer/
    location = /officer.html {
        return 301 /officer/;
    }

    # Optional proxy to backend API
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
