services:
  - type: web
    name: ai-citizen-grievance-system
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: citizen-grievance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8000

databases:
  - name: citizen-grievance-db
    databaseName: citizen_portal
    user: postgres
    plan: free
    region: oregon
